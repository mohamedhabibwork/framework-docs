# Static Starlight output: every page is <route>/index.html; hashed assets
# live under /_astro and are immutable. TLS terminates at Dokploy's Traefik.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;

    # add_header in a location replaces the server-level set, so each
    # location repeats the security headers it needs.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
